<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CodeMigrate - AI Code Migration Tool</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 1300px;
      margin: 30px auto;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0 20px;
    }
    h1 { color: #38bdf8; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    button:hover { background: #0ea5e9; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .arrow { color: #64748b; font-size: 20px; }
    .panels {
      display: flex;
      gap: 16px;
    }
    .panel { width: 50%; }
    .panel label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    textarea {
      width: 100%;
      height: 420px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      resize: vertical;
    }
    .status-bar {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge.high { background: #14532d; color: #4ade80; }
    .badge.medium { background: #713f12; color: #facc15; }
    .badge.low { background: #7f1d1d; color: #f87171; }
    .badge.none { display: none; }
    .issues {
      font-size: 13px;
      color: #94a3b8;
    }
    button.secondary {
      background: #334155;
      color: #e2e8f0;
      font-weight: 500;
    }
    button.secondary:hover { background: #475569; }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }
    .examples .hint { color: #64748b; font-size: 12px; margin-right: 4px; }
    #statusText { color: #94a3b8; font-size: 14px; }
    .history { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .history label { color: #94a3b8; font-size: 13px; }
    .history select { min-width: 260px; }
  </style>
</head>
<body>
  <h1>🔄 CodeMigrate</h1>
  <p class="subtitle">AI-powered code migration between languages &amp; frameworks — SIH 2026 MVP</p>

  <div class="controls">
    <select id="source">
      <option>Python</option>
      <option>JavaScript</option>
      <option>Java</option>
      <option>TypeScript</option>
      <option>Angular</option>
      <option>C++</option>
    </select>
    <span class="arrow">→</span>
    <select id="target">
      <option>JavaScript</option>
      <option>Python</option>
      <option>Java</option>
      <option>React</option>
      <option>TypeScript</option>
      <option>Go</option>
    </select>
    <button id="convertBtn" onclick="convert()">Convert Code</button>
    <button class="secondary" id="downloadBtn" onclick="downloadOutput()" disabled>Download</button>
    <span id="statusText"></span>
  </div>

  <div class="examples" id="exampleBar">
    <span class="hint">Demo snippets:</span>
  </div>

  <div class="history">
    <label for="historySelect">Recent conversions</label>
    <select id="historySelect" onchange="loadHistory(this.value)">
      <option value="">No saved conversions</option>
    </select>
    <button class="secondary" type="button" onclick="clearHistory()">Clear History</button>
  </div>

  <div class="panels">
    <div class="panel">
      <label>Source Code</label>
      <textarea id="input" placeholder="Paste your source code here..."></textarea>
    </div>
    <div class="panel">
      <label>Converted Code</label>
      <textarea id="output" placeholder="Converted code will appear here..." readonly></textarea>
    </div>
  </div>

  <div class="status-bar">
    <span id="confidenceBadge" class="badge none"></span>
    <span id="issuesText" class="issues"></span>
  </div>

  <script>
    const BACKEND_URL = window.location.protocol === "file:"
      ? "http://localhost:5000"
      : "";
    const HISTORY_KEY = "codemigrate-history";
    const MAX_HISTORY_ITEMS = 20;

    function setSelectValue(id, value) {
      const el = document.getElementById(id);
      const match = [...el.options].find(o => o.value === value);
      if (match) el.value = value;
    }

    function getHistory() {
      try {
        const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        return Array.isArray(history) ? history : [];
      } catch (err) {
        return [];
      }
    }

    function saveHistory(entry) {
      const history = [entry, ...getHistory()].slice(0, MAX_HISTORY_ITEMS);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const select = document.getElementById("historySelect");
      const history = getHistory();
      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.innerText = history.length ? "Select a saved conversion" : "No saved conversions";
      select.appendChild(placeholder);
      history.forEach((entry, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.innerText = `${entry.source_lang} → ${entry.target_lang} · ${entry.created_at}`;
        select.appendChild(option);
      });
    }

    function loadHistory(index) {
      if (index === "") return;
      const entry = getHistory()[Number(index)];
      if (!entry) return;
      setSelectValue("source", entry.source_lang);
      setSelectValue("target", entry.target_lang);
      document.getElementById("input").value = entry.source_code;
      document.getElementById("output").value = entry.converted_code;
      document.getElementById("downloadBtn").disabled = false;
      const badgeMap = {
        high_confidence: ["high", "High Confidence"],
        medium_confidence: ["medium", "Medium Confidence"],
        low_confidence: ["low", "Needs Review"]
      };
      const [cls, label] = badgeMap[entry.confidence.status] || ["none", ""];
      const badge = document.getElementById("confidenceBadge");
      badge.className = `badge ${cls}`;
      badge.innerText = label;
      document.getElementById("issuesText").innerText = entry.confidence.issues.join(" · ");
      document.getElementById("statusText").innerText = "Saved conversion loaded";
    }

    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
      document.getElementById("statusText").innerText = "Conversion history cleared";
    }

    async function loadExamples() {
      const bar = document.getElementById("exampleBar");
      try {
        const res = await fetch(`${BACKEND_URL}/examples`);
        const data = await res.json();
        (data.examples || []).forEach(ex => {
          const btn = document.createElement("button");
          btn.className = "secondary";
          btn.type = "button";
          btn.innerText = ex.label;
          btn.title = ex.note || "";
          btn.onclick = () => loadExample(ex.id);
          bar.appendChild(btn);
        });
      } catch (err) {
        const note = document.createElement("span");
        note.className = "hint";
        note.innerText = "Could not load examples. Run python app.py then open http://localhost:5000";
        bar.appendChild(note);
      }
    }

    async function loadExample(id) {
      const statusText = document.getElementById("statusText");
      try {
        const res = await fetch(`${BACKEND_URL}/examples/${id}`);
        const data = await res.json();
        if (data.status !== "ok") {
          statusText.innerText = "❌ " + data.message;
          return;
        }
        setSelectValue("source", data.source_lang);
        setSelectValue("target", data.target_lang);
        document.getElementById("input").value = data.code;
        document.getElementById("output").value = "";
        document.getElementById("downloadBtn").disabled = true;
        document.getElementById("confidenceBadge").className = "badge none";
        document.getElementById("issuesText").innerText = "";
        statusText.innerText = data.note || "Example loaded — click Convert";
      } catch (err) {
        statusText.innerText = "❌ Could not load example. Is python app.py running?";
      }
    }

    function downloadOutput() {
      const code = document.getElementById("output").value;
      if (!code.trim()) return;
      const target = document.getElementById("target").value.toLowerCase();
      const ext = {
        python: "py", javascript: "js", java: "java",
        react: "jsx", typescript: "ts", go: "go"
      }[target] || "txt";
      const blob = new Blob([code], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `converted.${ext}`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function convert() {
      const btn = document.getElementById("convertBtn");
      const statusText = document.getElementById("statusText");
      const badge = document.getElementById("confidenceBadge");
      const issuesText = document.getElementById("issuesText");
      const code = document.getElementById("input").value;

      if (!code.trim()) {
        statusText.innerText = "⚠️ Paste some code first, or click a demo snippet";
        return;
      }

      btn.disabled = true;
      document.getElementById("downloadBtn").disabled = true;
      statusText.innerText = "Converting… first run can take up to ~2 min while the model loads";
      badge.className = "badge none";
      issuesText.innerText = "";

      try {
        const res = await fetch(`${BACKEND_URL}/convert`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source_lang: document.getElementById("source").value,
            target_lang: document.getElementById("target").value,
            code: code
          })
        });
        const data = await res.json();

        if (data.status === "success") {
          document.getElementById("output").value = data.converted_code;
          document.getElementById("downloadBtn").disabled = false;
          statusText.innerText = "✅ Done";

          const conf = data.confidence;
          const badgeMap = {
            high_confidence: ["high", "High Confidence"],
            medium_confidence: ["medium", "Medium Confidence"],
            low_confidence: ["low", "Needs Review"]
          };
          const [cls, label] = badgeMap[conf.status] || ["none", ""];
          badge.className = `badge ${cls}`;
          badge.innerText = label;
          issuesText.innerText = conf.issues.join(" · ");
          saveHistory({
            source_lang: document.getElementById("source").value,
            target_lang: document.getElementById("target").value,
            source_code: code,
            converted_code: data.converted_code,
            confidence: conf,
            created_at: new Date().toLocaleString()
          });
        } else {
          const hint = data.hint ? " — " + data.hint : "";
          statusText.innerText = "❌ " + data.message + hint;
        }
      } catch (err) {
        statusText.innerText = "❌ Could not reach backend. Run: python app.py then open http://localhost:5000";
      } finally {
        btn.disabled = false;
      }
    }

    renderHistory();
    loadExamples();
  </script>
</body>
</html>
